name: Deploy Nginx Config
on:
  push:
    paths:
      - 'nginx/sites-available/**.conf'  # Only trigger when nginx config changes
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy config to server
      uses: appleboy/scp-action@v0.1.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "nginx/sites-available/server.conf"
        target: "/tmp/"

    - name: Validate and reload config
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Generate checksums of current and new config
          CURRENT_SUM=$(sudo sha256sum /etc/nginx/sites-available/game-server | cut -d' ' -f1)
          NEW_SUM=$(sha256sum /tmp/sites-available/server.conf| cut -d' ' -f1)
          
          if [ "$CURRENT_SUM" != "$NEW_SUM" ]; then
            echo "Config changed, deploying..."
            sudo cp /tmp/sites-available/server.conf /etc/nginx/sites-available/game-server
            sudo ln -sf /etc/nginx/sites-available/creepagons.conf /etc/nginx/sites-enabled/
            
            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "✅ Nginx reloaded successfully"
            else
              echo "❌ Nginx config test failed!"
              exit 1
            fi
          else
            echo "✅ No changes detected, skipping reload"
          fi