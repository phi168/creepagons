name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up SSH agent and add the private key from secrets
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      
      - name: Kill old process if necessary
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          if pgrep server.x86_64 > /dev/null
          then
            echo "Stopping running process..."
            pkill -f /usr/local/bin/server.x86_64  
          else
            echo "Process is not running."
          fi
          EOF
          
      # Copy the subfolder to the GCE instance
      - name: Move files over
        run: |
          scp -r -o StrictHostKeyChecking=no ./build/linux/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/build/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mv /tmp/build/* /usr/local/bin/"
          scp -r -o StrictHostKeyChecking=no ./project/ai/*   ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/ai/
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo mkdir -p /usr/local/bin/ai && sudo mv /tmp/ai/* /usr/local/bin/ai/"
      - name: Start server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF' 
          chmod +x /usr/local/bin/server.x86_64
          cd /usr/local/bin
          sudo nohup /usr/local/bin/server.x86_64 --headless &> ~/server_output.log &
          echo "process restarted"
          EOF
