server {
    listen 80;
    server_name creepagonsserver.buecking.me;
    
    # For WebSockets, we can't redirect. Instead, we need to proxy
    # OR we can reject non-SSL WebSocket attempts
    location / {
        return 403;  # Deny plain HTTP WebSocket connections
        # OR proxy to HTTPS (but better to force client to use wss://) 
    }
}

server {
    listen 443 ssl http2;
    server_name creepagonsserver.buecking.me;

    ssl_certificate /etc/letsencrypt/live/creepagonsserver.buecking.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creepagonsserver.buecking.me/privkey.pem;

    # WebSocket-specific configuration
    location /websocket/ {
        proxy_pass http://localhost:3000;  # Your game server port
        
        # Essential WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Standard proxy headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeouts for persistent connections
        proxy_read_timeout 86400s;  # 24 hours
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }
}